
spring.application.name=credit-batch
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/credit_db
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=always

credit.batch.csv-resource=classpath:data/synthetic_credit_clients_10000.csv
credit.batch.scheduler.enabled=false

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

management.endpoints.web.exposure.include=health,info
